name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only what the Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # The build needs these or it silently produces a site that cannot reach
      # Supabase: the policy loses its origins and import.meta.env comes back
      # undefined. They are repository *variables*, not secrets - both are
      # public by design, and the publishable key is built to ship inside a
      # browser bundle. vite.config.js now fails the build outright when they
      # are absent, because the old failure mode was a silent dead deploy.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # enablement lets the first run on a fresh repository turn Pages on
      # itself, rather than failing with "Get Pages site failed".
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
