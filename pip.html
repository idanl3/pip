<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#fff6ec" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <title>Pip</title>
    <link rel="stylesheet" href="./src/styles/base.css" />
    <link rel="stylesheet" href="./src/styles/app.css" />
    <link rel="stylesheet" href="./src/styles/pip.css" />
  </head>
  <body class="pip">
    <!-- Two stages: the PIN, then Pip.
         Nothing in between. The parent used to pick who was involved here, and
         that selection told Pip nothing it does not ask the children itself.
         A fight is happening while this screen is open; it should cost one tap
         and a PIN.

         Both stages are on one page because the browser grants the microphone
         only during a user gesture, and a gesture does not survive a
         navigation. The tap that accepts the PIN is the tap the conversation
         opens from. -->

    <!-- A refusal needs a way forward. On a phone, with a fight going on, a
         parent who has just allowed the microphone in the address bar should
         not have to work out that the page needs reloading. -->
    <div class="pip__notice">
      <div id="notice" class="notice notice--error" role="alert"></div>
      <button type="button" id="retry" class="btn pip__retry hidden">Try again</button>
    </div>

    <section id="stage-pin" class="pip__stage hidden"></section>

    <section id="stage-live" class="pip__stage pip__stage--live hidden">
      <canvas id="blob" class="pip__blob" aria-hidden="true"></canvas>

      <!-- No caption. The blob says whose turn it is to anyone in the room,
           including a five-year-old who cannot read one. These words appear
           only while Pip is still being fetched, when the screen would
           otherwise look broken. -->
      <p class="pip__status" id="connecting">Getting Pip ready&hellip;</p>

      <button class="pip__end" id="end" type="button">Finish</button>
    </section>

    <!-- For screen readers, and only at the two moments that matter. -->
    <p class="visually-hidden" id="announce" role="status" aria-live="polite"></p>

    <div id="alert" class="pip__alert hidden" role="alertdialog" aria-labelledby="alert-heading">
      <div class="pip__alert-inner">
        <h2 id="alert-heading">Please come over</h2>
        <p>
          Pip heard something it thinks you should hear about, and has stopped
          the conversation. Ask them gently — Pip has not told us what it was,
          and will not.
        </p>
        <button class="btn" id="alert-ok" type="button">I'm here</button>
      </div>
    </div>

    <script type="module" src="./src/pip.js"></script>
  </body>
</html>
