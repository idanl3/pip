<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#fff6ec" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <title>Pip</title>
    <link rel="stylesheet" href="./src/styles/base.css" />
    <link rel="stylesheet" href="./src/styles/app.css" />
  </head>
  <body>
    <!-- The launch screen, and almost nothing else.
         It gets opened with a fight already under way, so there is one obvious
         thing to do. Everything a parent might want to read or change lives
         behind the word in the corner. -->
    <div class="launch">
      <div class="launch__top">
        <div class="launch__brand">
          <div class="page__mark" aria-hidden="true"></div>
          <h1 class="page__title">Pip</h1>
        </div>
        <a class="launch__corner" href="/parents.html">Parents</a>
      </div>

      <div class="launch__middle">
        <div id="notice" class="notice notice--error" role="alert"></div>

        <!-- Approved: the button, and nothing competing with it. -->
        <div id="ready" class="launch__ready hidden">
          <a class="launch__start" href="/pip.html">Start</a>
          <p class="launch__hint">
            Pip will ask who is there. Stay nearby — Pip is your helper, not a
            babysitter.
          </p>
          <!-- Only ever shown when this device has not given Pip the
               microphone. Better to say so now than at the start of a fight. -->
          <p class="launch__hint launch__nudge hidden" id="mic-nudge">
            Pip has not been given the microphone on this device yet.
            <a href="/parents.html">Set it up in Parents</a> before you need it.
          </p>
        </div>

        <!-- Not approved yet, or paused. -->
        <div id="waiting" class="launch__waiting hidden">
          <p class="launch__waiting-title" id="waiting-title"></p>
          <p class="launch__hint" id="waiting-body"></p>
          <p class="launch__hint" id="waiting-note"></p>
        </div>
      </div>

      <!-- Deliberately no minutes here. This screen is looked at by the
           children, and how much of the family's allowance is left is a
           parent's business. It is in the parents' portal. -->
      <p class="launch__foot"></p>
    </div>

    <script type="module" src="./src/home.js"></script>
  </body>
</html>
